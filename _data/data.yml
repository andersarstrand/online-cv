career-profile:
  title: Karriärsprofil
  summary: |
    Senior systemintegratör med gedigen teknisk bakgrund som utvecklare och testare.

    Jag trivs bäst med att arbeta i gränslandet hårdvara - mjukvara samt med system och integration. 
    Det senaste decenniet har fokus legat på utveckling och test av inbyggda system och integration, men även framtagande av analys- och testverktyg.  
    
    Min samlade erfarenhet gör att jag snabbt förstår komplexa system och på så vis kan optimera mina insatser där de ger mest effekt. Efter att ha arbetat många år i utvecklingsteam i olika former vill jag säga att utöver mina breda tekniska kunskaper är en av mina styrkor kommunikation med kunder, projektledare och utvecklare. 

