    time: 2015-09 - 2016-10
    company: Arbetsförmedlingen IT (Konsult) 
    details: |
      Utveckling av metoder för prestandatest. Utbildning i Teknisktestning och prestandatest. Framtagning av mål och metod för ny ”test-organisation” som en del i AFs Förnyelseresa 2022. Ansvar för daglig drift i ”Prestandatest gruppen”.

      Teknologi och verktyg:  
      Oracle Application Testing Suite, Visual Studio Ultimate, HP Loadrunner, jConsol, Visual VM, Windows Performace Monitor, jMeter, Fiddler, SoapUI, GIT, Jenkins

