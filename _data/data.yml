    public: True
    role: Sektionschef (TF) 
    time: 2016-09 - 2017-09
    company: Arbetsförmedlingen IT (Konsult) 
    details: |
      Sektionschef (TF) för sektion som arbetade med Teknisktestning, Testdata hantering, Tillgänglighetstester, Testautomation, Testmiljöer samt teststrategi. Drivit arbeta med vision och strategi inom enheten (Riktning och Stöd) som en del av (AFs) Förnyelseresa 2021 samt transformationen av sektionen för att arbeta mer primärt med utbildning och strategi. Ansvarig för uppstart och framtagning av ny teststrategi för AF. Ansvarig för framtagning av sektionens verksamhetsplan.

      Teknologi och verktyg:  
      Agil Test, Scrum, Office 365, Jira, Confluence

  - title: TTC (Tekniskt Test Centrum) 
